<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser le mot de passe — FrenchConnect</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260116" />
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/index.html">
        <img src="assets/images/logo.png" alt="FrenchConnect" class="logo" />
      </a>
      <nav class="nav">
        <a href="/shop.html">Boutique</a>
        <a href="/about.html">Nos valeurs</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding: 20px 0; max-width: 520px;">
    <h1 style="margin:0 0 10px;">Nouveau mot de passe</h1>
    <p class="muted-sm" style="opacity:.85;margin-top:0;">
      Choisis un nouveau mot de passe pour ton compte.
    </p>

    <div id="msg" style="display:none;margin:12px 0;"></div>

    <section class="card" style="padding:16px;border-radius:14px;">
      <form id="reset-form" style="display:grid;gap:10px;">
        <div>
          <label class="muted-sm" for="new-password">Nouveau mot de passe</label>
          <input id="new-password" type="password" autocomplete="new-password" required />
        </div>

        <div>
          <label class="muted-sm" for="new-password-2">Confirmer</label>
          <input id="new-password-2" type="password" autocomplete="new-password" required />
        </div>

        <button id="save-btn" type="submit">Enregistrer</button>
      </form>

      <div class="muted-sm" style="margin-top:10px;opacity:.8;">
        Après validation, tu pourras te reconnecter sur la page Checkout.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    (function () {
      const SUPABASE_URL = "https://mnsqfagfdahvhlfopfah.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uc3FmYWdmZGFodmhsZm9wZmFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MDE3NjEsImV4cCI6MjA4MzE3Nzc2MX0.yvzgQ9MVXN6lH8pnfiBAB0kFHCAkCzQYIQwNrSXDVEQ";

      const $ = (id) => document.getElementById(id);

      function showMsg(type, text) {
        const box = $("msg");
        if (!box) return;
        box.style.display = "block";
        box.style.padding = "12px";
        box.style.borderRadius = "12px";
        box.style.fontWeight = "700";
        box.style.border = "1px solid rgba(255,255,255,.12)";
        box.style.background = type === "ok" ? "rgba(0,180,80,.12)" : "rgba(220,50,50,.12)";
        box.innerHTML = text;
      }

      async function main() {
        if (!window.supabase?.createClient) {
          showMsg("err", "Supabase JS non chargé.");
          return;
        }

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Important: quand tu arrives depuis le mail, Supabase met la session dans l’URL
        // On tente de récupérer la session (si pas présent -> message clair)
        const { data } = await sb.auth.getSession();
        const user = data?.session?.user;

        if (!user) {
          showMsg("err", "Lien invalide ou expiré. Recommence “Mot de passe oublié ?” sur la page Checkout.");
          return;
        }

        showMsg("ok", "OK ✅ Choisis ton nouveau mot de passe.");

        $("reset-form").addEventListener("submit", async (e) => {
          e.preventDefault();

          const p1 = $("new-password").value || "";
          const p2 = $("new-password-2").value || "";
          if (p1.length < 6) {
            showMsg("err", "Mot de passe trop court (min 6 caractères).");
            return;
          }
          if (p1 !== p2) {
            showMsg("err", "Les mots de passe ne correspondent pas.");
            return;
          }

          const btn = $("save-btn");
          btn.disabled = true;
          btn.textContent = "Enregistrement…";

          try {
            const { error } = await sb.auth.updateUser({ password: p1 });
            if (error) throw error;

            showMsg("ok", "Mot de passe mis à jour ✅ Tu peux retourner au checkout et te connecter.");
            setTimeout(() => (window.location.href = "https://frenchconnect31.com/checkout.html"), 1200);
          } catch (err) {
            showMsg("err", err?.message || "Erreur");
          } finally {
            btn.disabled = false;
            btn.textContent = "Enregistrer";
          }
        });
      }

      main();
    })();
  </script>
</body>
</html>
