<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrenchConnect — Boutique</title>

  <!-- Fonts (Street) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- cache-bust CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=20260106" />
</head>

<body>
  <div class="age-banner">
    Vente réservée aux majeurs • Produits conformes UE • THC &lt; 0,3%
  </div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="FrenchConnect Accueil">
        <img class="logo" src="assets/images/logo.png" alt="FrenchConnect" />
      </a>

      <!-- NAV DESKTOP -->
      <nav class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a class="active" href="shop.html">Boutique</a>
        <a class="cart-link" href="cart.html">Panier <span id="cart-count">0</span></a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </nav>

      <!-- BURGER MOBILE -->
      <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- MENU MOBILE OVERLAY -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="backdrop" id="menuBackdrop"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="head">
        <strong>FRENCHCONNECT</strong>
        <button class="close" id="menuClose" aria-label="Fermer">✕</button>
      </div>
      <div class="links">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="shop.html?cat=fleurs">Fleurs</a>
        <a href="shop.html?cat=resines">Résines</a>
        <a href="shop.html?cat=extraits">Extraits</a>
        <a href="shop.html?cat=prerolls">Pre Rolls</a>
        <a href="cart.html">Panier</a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </div>

  <main class="container" style="padding: 20px 0;">
    <div class="wrap">
      <h1 style="margin: 0 0 10px;">Boutique</h1>

      <section class="filters" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin: 12px 0 18px;">
        <input
          id="search"
          type="text"
          placeholder="Rechercher un produit…"
          style="min-width:220px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:transparent; color:inherit;"
        />

        <select
          id="category-filter"
          style="padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:transparent; color:inherit;"
        >
          <option value="">Tout</option>
          <option value="fleurs">Fleurs</option>
          <option value="resines">Résines</option>
          <option value="extraits">Extraits</option>
          <option value="prerolls">Pre Rolls</option>
        </select>
      </section>

      <section id="product-grid" class="grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
        <!-- Injecté par JS -->
      </section>
    </div>
  </main>

  <footer class="site-footer" style="padding: 24px 0; border-top: 1px solid rgba(255,255,255,.08); margin-top: 40px;">
    <div class="container" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <small>© FrenchConnect</small>
      <div style="display:flex; gap:12px;">
        <a href="legal.html">Mentions légales</a>
        <a href="cgv.html">CGV</a>
      </div>
    </div>
  </footer>

  <!-- Burger JS (SAFE, indépendant) -->
  <script>
  (function(){
    const toggle = document.getElementById("navToggle");
    const menu   = document.getElementById("mobileMenu");
    const close  = document.getElementById("menuClose");
    const back   = document.getElementById("menuBackdrop");

    if(!toggle || !menu) return;

    function openMenu(){
      document.body.classList.add("menu-open");
      menu.classList.add("open");
      menu.setAttribute("aria-hidden","false");
      toggle.setAttribute("aria-expanded","true");
    }
    function closeMenu(){
      document.body.classList.remove("menu-open");
      menu.classList.remove("open");
      menu.setAttribute("aria-hidden","true");
      toggle.setAttribute("aria-expanded","false");
    }

    toggle.addEventListener("click", () => {
      if(menu.classList.contains("open")) closeMenu();
      else openMenu();
    });

    if(close) close.addEventListener("click", closeMenu);
    if(back)  back.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeMenu();
    });

    menu.addEventListener("click", (e) => {
      const a = e.target.closest("a");
      if(a) closeMenu();
    });
  })();
  </script>

  <!-- store.js (UNE SEULE FOIS, en bas) -->
  <script src="assets/js/store.js?v=20260106"></script>
</body>
</html>
