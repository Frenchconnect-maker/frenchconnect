<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrenchConnect — Mes commandes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css?v=20260106" />

  <style>
    .wrap-max{max-width:1200px;margin:0 auto;padding:18px}
    .panel-card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      overflow:hidden;
      backdrop-filter: blur(6px);
      margin: 14px 0;
    }
    .panel-card .hd{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .panel-card .bd{padding:14px}

    .order-meta{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      color: rgba(255,255,255,.8);
      font-size: .95rem;
    }
    .tag{
      display:inline-flex;align-items:center;gap:8px;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.7px;
      font-size:.78rem;
    }
    .tag.new{ border-color: rgba(57,255,20,.35); }
    .tag.shipped{ border-color: rgba(0,229,255,.35); }
    .tag.cancelled{ border-color: rgba(255,43,214,.35); }
    .tag.paid{ border-color: rgba(255,255,255,.25); }

    .items{
      margin-top:10px;
      border-top:1px solid rgba(255,255,255,.10);
      padding-top:10px;
      display:grid; gap:10px;
    }
    .item{
      display:flex; justify-content:space-between; gap:12px;
      padding:10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      background: rgba(0,0,0,.18);
    }
    .item strong{font-weight:900}
    .muted-sm{color: rgba(255,255,255,.70); font-size:.92rem}
    .right{text-align:right}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap}
    .notice{
      margin-top:10px;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
    }
    .danger{color:#ff7b7b}
    .ok{color:#7bffb2}

    /* Auth box */
    .auth-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    @media (max-width:720px){
      .auth-grid{grid-template-columns:1fr;}
    }
    .auth-grid input{
      width:100%;
    }
    .radio-row{
      display:flex; gap:14px; flex-wrap:wrap; align-items:center;
      margin-bottom:10px;
    }
    .radio-row label{
      display:flex; gap:8px; align-items:center;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div class="age-banner">
    Vente réservée aux majeurs • Produits conformes UE • THC &lt; 0,3%
  </div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="FrenchConnect Accueil">
        <img class="logo" src="assets/images/logo.png" alt="FrenchConnect" />
      </a>

      <nav class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a class="cart-link" href="cart.html">Panier <span id="cart-count">0</span></a>
        <a class="active" href="account.html">Mon compte</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="backdrop" id="menuBackdrop"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="head">
        <strong>FRENCHCONNECT</strong>
        <button class="close" id="menuClose" aria-label="Fermer">✕</button>
      </div>
      <div class="links">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a href="account.html">Mon compte</a>
      </div>
    </div>
  </div>

  <main class="wrap-max">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div>
        <h1 style="margin:6px 0;">Mon compte</h1>
        <div class="muted-sm" id="whoami">Chargement…</div>
      </div>
      <div class="top-actions">
        <a class="btn ghost" href="shop.html">Continuer shopping</a>
        <button class="btn" id="logoutBtn" type="button" style="display:none;">Déconnexion</button>
      </div>
    </div>

    <div id="msg" class="notice" style="display:none;"></div>

    <!-- ✅ AUTH BOX (s'affiche uniquement si déconnecté) -->
    <section class="panel-card" id="authBox" style="display:none;">
      <div class="hd">
        <strong style="letter-spacing:.6px;text-transform:uppercase;">Connexion</strong>
        <span class="muted-sm">Accès à tes commandes</span>
      </div>
      <div class="bd">
        <div class="radio-row">
          <label><input type="radio" name="authMode" value="login" checked> J’ai déjà un compte</label>
          <label><input type="radio" name="authMode" value="signup"> Créer un compte</label>
        </div>

        <form id="authForm">
          <div class="auth-grid">
            <div style="grid-column:1/-1">
              <label class="muted-sm">Email *</label>
              <input id="email" type="email" required placeholder="ex: moi@gmail.com">
            </div>
            <div style="grid-column:1/-1">
              <label class="muted-sm">Mot de passe *</label>
              <input id="password" type="password" required placeholder="••••••••">
            </div>

            <div>
              <label class="muted-sm">Prénom (optionnel)</label>
              <input id="first_name" type="text" placeholder="Prénom">
            </div>
            <div>
              <label class="muted-sm">Nom (optionnel)</label>
              <input id="last_name" type="text" placeholder="Nom">
            </div>
            <div style="grid-column:1/-1">
              <label class="muted-sm">Téléphone (optionnel)</label>
              <input id="phone" type="text" placeholder="06…">
            </div>
          </div>

          <div class="btn-row" style="margin-top:12px">
            <button class="btn" id="authSubmit" type="submit">Se connecter</button>
          </div>
        </form>
      </div>
    </section>

    <h2 style="margin:18px 0 8px;">Mes commandes</h2>
    <div id="orders"></div>
  </main>

  <footer class="site-footer" style="margin-top: 34px;">
    <div class="copy wrap">© <span id="year"></span> FrenchConnect</div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    (function(){
      const toggle = document.getElementById("navToggle");
      const menu   = document.getElementById("mobileMenu");
      const close  = document.getElementById("menuClose");
      const back   = document.getElementById("menuBackdrop");
      if(!toggle || !menu) return;

      function openMenu(){ document.body.classList.add("menu-open"); menu.classList.add("open"); toggle.setAttribute("aria-expanded","true"); }
      function closeMenu(){ document.body.classList.remove("menu-open"); menu.classList.remove("open"); toggle.setAttribute("aria-expanded","false"); }

      toggle.addEventListener("click", () => menu.classList.contains("open") ? closeMenu() : openMenu());
      if(close) close.addEventListener("click", closeMenu);
      if(back)  back.addEventListener("click", closeMenu);
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeMenu(); });
      menu.addEventListener("click",(e)=>{ if(e.target.closest("a")) closeMenu(); });
    })();
  </script>

  <script src="assets/js/store.js?v=20260106"></script>
  <script src="assets/js/account.js?v=20260106"></script>
</body>
</html>
