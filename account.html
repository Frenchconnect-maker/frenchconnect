<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mon compte — FrenchConnect</title>

  <link rel="stylesheet" href="assets/css/style.css?v=20260121" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />

  <style>
    .wrap-max{max-width:1100px;margin:0 auto;padding:16px}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media(min-width:980px){.grid{grid-template-columns:1fr 1.4fr}}

    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      overflow:hidden;
      backdrop-filter:blur(6px)
    }
    .card .hd{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap
    }
    .card .bd{padding:14px}

    .muted-sm{color:rgba(255,255,255,.7);font-size:.9rem}
    .notice{padding:10px 12px;border-radius:12px;font-weight:700;margin-top:10px}
    .ok{background:rgba(0,180,80,.12)}
    .err{background:rgba(220,50,50,.12)}

    .field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
    .field label{font-weight:800}
    .field input{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.03);color:#fff
    }

    .orders{display:grid;gap:12px}
    .order{
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:12px
    }
    .order-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .badge{
      padding:6px 10px;border-radius:999px;
      font-weight:900;font-size:.75rem;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.2)
    }
    .items{margin-top:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
    .item{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
  </style>
</head>

<body>
  <div class="age-banner">Vente réservée aux majeurs • Produits conformes UE • THC &lt; 0,3%</div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/images/logo.png" alt="FrenchConnect" class="logo" />
      </a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a class="active" href="account.html">Mon compte</a>
      </nav>
    </div>
  </header>

  <main class="wrap-max">
    <h1 style="margin-bottom:6px">Mon compte</h1>
    <div id="auth-status" class="muted-sm">Vérification…</div>

    <div id="msg" class="notice" style="display:none"></div>

    <div class="grid" style="margin-top:14px">

      <!-- AUTH -->
      <section class="card">
        <div class="hd">
          <strong>Connexion</strong>
          <button id="logoutBtn" class="btn" style="display:none">Déconnexion</button>
        </div>
        <div class="bd">
          <div id="auth-msg" class="notice" style="display:none"></div>

          <form id="login-form" style="display:none">
            <div class="field">
              <label>Email</label>
              <input id="login-email" type="email" required>
            </div>
            <div class="field">
              <label>Mot de passe</label>
              <input id="login-password" type="password" required>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
              <button id="login-btn" class="btn" type="submit">Se connecter</button>
              <button id="forgot-btn" type="button" class="btn ghost">Mot de passe oublié ?</button>
            </div>

            <div class="muted-sm" style="margin-top:10px">
              Le compte se crée automatiquement lors de la première commande.
            </div>
          </form>
        </div>
      </section>

      <!-- PROFIL -->
      <section class="card" id="profile-card" style="display:none">
        <div class="hd"><strong>Mes informations</strong></div>
        <div class="bd">
          <form id="profile-form">
            <div class="field">
              <label>Prénom</label>
              <input id="p_first_name">
            </div>
            <div class="field">
              <label>Nom</label>
              <input id="p_last_name">
            </div>
            <div class="field">
              <label>Email</label>
              <input id="p_email" disabled>
            </div>
            <div class="field">
              <label>Téléphone</label>
              <input id="p_phone">
            </div>

            <button id="save-profile" class="btn" type="submit">Enregistrer</button>
          </form>
        </div>
      </section>

      <!-- COMMANDES -->
      <section class="card" id="orders-card" style="grid-column:1/-1;display:none">
        <div class="hd"><strong>Mes commandes</strong></div>
        <div class="bd">
          <div id="orders" class="orders"></div>
          <div id="orders-empty" class="muted-sm" style="display:none">
            Aucune commande pour le moment.
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer" style="margin-top:30px">
    <div class="copy wrap">© <span id="year"></span> FrenchConnect</div>
  </footer>

  <script>document.getElementById("year").textContent=new Date().getFullYear()</script>

  <script src="assets/js/store.js?v=20260121"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/account.js?v=20260121"></script>
</body>
</html>
