<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Mon compte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html">← Boutique</a>
    <strong>Mon compte</strong>
  </div>
</header>

<main class="container" style="max-width:900px">

  <!-- LOGIN -->
  <section id="auth-box">
    <h2>Connexion / Inscription</h2>

    <form id="auth-form">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Mot de passe" required>

      <button class="btn" type="submit">Se connecter / Créer un compte</button>
    </form>

    <div id="auth-msg" class="muted" style="margin-top:10px"></div>
  </section>

  <!-- COMPTE -->
  <section id="account-box" style="display:none">
    <h2 id="welcome"></h2>

    <button id="logout" class="btn ghost">Se déconnecter</button>

    <hr style="margin:24px 0">

    <h3 id="orders-title">Mes commandes</h3>

    <div id="orders"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/account.js"></script>

</body>
</html>
