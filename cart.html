<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FrenchConnect — Panier</title>

  <link rel="stylesheet" href="assets/css/style.css?v=20260106">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/images/logo.png" alt="FrenchConnect">
      </a>

      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="fleurs-fr.html">Fleurs FR</a>
        <a href="us.html">Produits US</a>
        <a href="caliweed.html">Cali Weed</a>
        <a class="active cart-link" href="cart.html">Panier <span id="cart-count">0</span></a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="nav-toggle" id="navToggle">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <div class="backdrop" id="menuBackdrop"></div>
    <div class="panel">
      <div class="head">
        <strong>FRENCHCONNECT</strong>
        <button class="close" id="menuClose">✕</button>
      </div>
      <div class="links">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </div>

  <main class="container">
    <h1>Panier</h1>

    <div class="btn-row">
      <a class="btn ghost" href="shop.html">Continuer achats</a>
      <button class="btn ghost" onclick="clearCart()">Vider le panier</button>
    </div>

    <section id="cart-items"></section>

    <hr>

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>Total : <span id="cart-total">0,00 €</span></strong>
      <a class="btn" href="#" onclick="startCheckout();return false;">Commander</a>
    </div>
  </main>

  <script src="assets/js/store.js?v=20260106"></script>
  <script>
    (function(){
      const t=document.getElementById("navToggle"),
            m=document.getElementById("mobileMenu"),
            c=document.getElementById("menuClose"),
            b=document.getElementById("menuBackdrop");
      if(!t) return;
      const o=()=>m.classList.add("open"),
            x=()=>m.classList.remove("open");
      t.onclick=()=>m.classList.contains("open")?x():o();
      c.onclick=x; b.onclick=x;
    })();
  </script>
</body>
</html>
