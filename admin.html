<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrenchConnect — Admin commandes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260106" />

  <style>
    .wrap-max{max-width:1200px;margin:0 auto;padding:18px}
    .panel-card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      overflow:hidden;
      backdrop-filter: blur(6px);
      margin: 14px 0;
    }
    .panel-card .hd{
      padding:14px 14px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .panel-card .bd{padding:14px}
    .muted-sm{color: rgba(255,255,255,.70); font-size:.92rem}

    .notice{
      margin-top:10px;padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
    }
    .danger{color:#ff7b7b}
    .ok{color:#7bffb2}

    .login-wrap{max-width:560px;margin:16px auto;}
    .login-form{display:grid;gap:12px}
    .login-form input{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.03);
      color:#fff;
    }

    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .toolbar input, .toolbar select{
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.03);
      color:#fff;
    }

    .row{
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:12px;
      background: rgba(0,0,0,.18);
      margin-top:10px;
    }
    .tag{
      display:inline-flex;align-items:center;
      padding:6px 10px;border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.7px;
      font-size:.78rem;
    }
    .tag.new{ border-color: rgba(57,255,20,.35); }
    .tag.paid{ border-color: rgba(255,255,255,.25); }
    .tag.shipped{ border-color: rgba(0,229,255,.35); }
    .tag.cancelled{ border-color: rgba(255,43,214,.35); }

    .items{margin-top:10px;display:grid;gap:8px}
    .item{
      display:flex;justify-content:space-between;gap:12px;
      padding:10px;border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
    }
  </style>
</head>

<body>
  <div class="age-banner">
    Admin • Commandes clients (Supabase)
  </div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="FrenchConnect Accueil">
        <img class="logo" src="assets/images/logo.png" alt="FrenchConnect" />
      </a>

      <nav class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="fleurs-fr.html">Fleurs FR</a>
        <a href="us.html">Produits US</a>
        <a href="caliweed.html">Cali Weed</a>
        <a class="cart-link" href="cart.html">Panier <span id="cart-count">0</span></a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="backdrop" id="menuBackdrop"></div>
    <div class="panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="head">
        <strong>FRENCHCONNECT</strong>
        <button class="close" id="menuClose" aria-label="Fermer">✕</button>
      </div>
      <div class="links">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a href="account.html">Mon compte</a>
        <a href="admin.html">Admin</a>
      </div>
    </div>
  </div>

  <main class="wrap-max">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div>
        <h1 style="margin:6px 0;">Admin — Commandes</h1>
        <div class="muted-sm" id="whoami">Chargement…</div>
      </div>
      <div class="toolbar">
        <input id="q" placeholder="Recherche (email, id, produit…)" />
        <select id="status">
          <option value="">Tous statuts</option>
          <option value="new">new</option>
          <option value="paid">paid</option>
          <option value="shipped">shipped</option>
          <option value="cancelled">cancelled</option>
        </select>
        <button class="btn ghost" id="refreshBtn" type="button">Actualiser</button>
        <button class="btn ghost" id="exportBtn" type="button">Exporter CSV</button>
        <button class="btn" id="logoutBtn" type="button" style="display:none;">Déconnexion</button>
      </div>
    </div>

    <div id="msg" class="notice" style="display:none;"></div>

    <!-- LOGIN ADMIN -->
    <div id="login-box" class="panel-card login-wrap" style="display:none;">
      <div class="hd">
        <strong>Connexion admin</strong>
        <span class="muted-sm">Accès back-office</span>
      </div>
      <div class="bd">
        <form id="login-form" class="login-form">
          <input id="login-email" type="email" required placeholder="Email admin">
          <input id="login-password" type="password" required placeholder="Mot de passe">
          <button class="btn" type="submit">Se connecter</button>
          <div class="muted-sm">⚠️ Seuls les comptes avec <strong>is_admin = true</strong> voient les commandes.</div>
        </form>
      </div>
    </div>

    <!-- LISTE -->
    <div id="orders"></div>
  </main>

  <script>
    // burger
    (function(){
      const toggle = document.getElementById("navToggle");
      const menu   = document.getElementById("mobileMenu");
      const close  = document.getElementById("menuClose");
      const back   = document.getElementById("menuBackdrop");
      if(!toggle || !menu) return;
      function openMenu(){ document.body.classList.add("menu-open"); menu.classList.add("open"); toggle.setAttribute("aria-expanded","true"); }
      function closeMenu(){ document.body.classList.remove("menu-open"); menu.classList.remove("open"); toggle.setAttribute("aria-expanded","false"); }
      toggle.addEventListener("click", () => menu.classList.contains("open") ? closeMenu() : openMenu());
      if(close) close.addEventListener("click", closeMenu);
      if(back)  back.addEventListener("click", closeMenu);
      document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeMenu(); });
      menu.addEventListener("click",(e)=>{ if(e.target.closest("a")) closeMenu(); });
    })();
  </script>

  <script src="assets/js/store.js?v=20260106"></script>
  <script src="assets/js/admin.js?v=20260106"></script>
</body>
</html>
