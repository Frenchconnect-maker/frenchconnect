<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrenchConnect — Produit</title>

  <!-- cache-bust CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=20260104" />
<script src="assets/js/store.js?v=20260104"></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img src="assets/images/logo.png" alt="FrenchConnect" style="height:36px" />
      </a>

      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier (<span id="cart-count">0</span>)</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 20px 0;">
    <section id="product-page" style="display:grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items:start;">
      <div class="product-media">
        <img id="p-image" src="" alt="" style="width:100%; border-radius: 16px; border: 1px solid rgba(255,255,255,.10);" />
      </div>

      <div class="product-info">
        <h1 id="p-name" style="margin:0 0 8px;"></h1>
        <p id="p-desc" style="opacity:.9; margin:0 0 12px;"></p>

        <div class="meta" style="opacity:.85; margin: 0 0 14px;">
          <span id="p-cat"></span>
          <span> • </span>
          <span id="p-badge"></span>
        </div>

        <div id="grammage-box" style="margin: 14px 0;">
          <label for="option" style="display:block; margin-bottom:6px;">Grammage</label>
          <select
            id="option"
            style="width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:transparent; color:inherit;"
          ></select>
        </div>

        <div style="margin: 14px 0;">
          <label for="qty" style="display:block; margin-bottom:6px;">Quantité</label>
          <input
            id="qty"
            type="number"
            min="1"
            value="1"
            style="width:120px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:transparent; color:inherit;"
          />
        </div>

        <p style="margin: 10px 0 16px;">
          Prix : <strong id="p-price"></strong>
        </p>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="add-to-cart" class="btn" type="button">Ajouter au panier</button>
          <a class="btn ghost" href="cart.html">Voir le panier</a>
          <a class="btn ghost" href="shop.html">Retour boutique</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" style="padding: 24px 0; border-top: 1px solid rgba(255,255,255,.08); margin-top: 40px;">
    <div class="container" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <small>© FrenchConnect</small>
      <div style="display:flex; gap:12px;">
        <a href="legal.html">Mentions légales</a>
        <a href="cgv.html">CGV</a>
      </div>
    </div>
  </footer>

  <!-- cache-bust JS -->
  <script src="assets/js/store.js?v=20260104"></script>
</body>
</html>
