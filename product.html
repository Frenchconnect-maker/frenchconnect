<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrenchConnect — Produit</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=20260106" />
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/images/logo.png" alt="FrenchConnect">
      </a>

      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a class="cart-link" href="cart.html">Panier <span id="cart-count">0</span></a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </nav>

      <button class="nav-toggle" id="navToggle">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <div class="backdrop" id="menuBackdrop"></div>
    <div class="panel">
      <div class="head">
        <strong>FRENCHCONNECT</strong>
        <button class="close" id="menuClose">✕</button>
      </div>
      <div class="links">
        <a href="index.html">Accueil</a>
        <a href="shop.html">Boutique</a>
        <a href="cart.html">Panier</a>
        <a href="account.html">Mon compte</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </div>

  <main class="container">
    <section id="product-page" style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
      <img id="p-image" style="width:100%;border-radius:16px;">
      <div>
        <h1 id="p-name"></h1>
        <p id="p-desc" class="muted"></p>

        <div class="muted">
          <span id="p-cat"></span> • <span id="p-badge"></span>
        </div>

        <div id="grammage-box" style="margin:14px 0;">
          <label>Grammage</label>
          <select id="option"></select>
        </div>

        <div style="margin:14px 0;">
          <label>Quantité</label>
          <input id="qty" type="number" min="1" value="1">
        </div>

        <p>Prix : <strong id="p-price"></strong></p>

        <div class="btn-row">
          <button id="add-to-cart" class="btn">Ajouter au panier</button>
          <a class="btn ghost" href="cart.html">Voir panier</a>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/store.js?v=20260106"></script>
  <script>
    // burger
    (function(){
      const t=document.getElementById("navToggle"),
            m=document.getElementById("mobileMenu"),
            c=document.getElementById("menuClose"),
            b=document.getElementById("menuBackdrop");
      if(!t) return;
      const o=()=>m.classList.add("open"),
            x=()=>m.classList.remove("open");
      t.onclick=()=>m.classList.contains("open")?x():o();
      c.onclick=x; b.onclick=x;
    })();
  </script>
</body>
</html>
