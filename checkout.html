<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement — FrenchConnect</title>

  <!-- Ton CSS -->
  <link rel="stylesheet" href="assets/css/style.css?v=20260116" />
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/index.html">
        <img src="assets/images/logo.png" alt="FrenchConnect" class="logo" />
      </a>
      <nav class="nav">
        <a href="/shop.html">Boutique</a>
        <a href="/about.html">Nos valeurs</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding: 20px 0;">
    <h1 style="margin: 0 0 10px;">Checkout</h1>

    <!-- Messages globaux -->
    <div id="msg" style="display:none;margin:12px 0;"></div>

    <div class="grid" style="display:grid;grid-template-columns:1fr;gap:16px;">

      <!-- =========================
           1) RÉSUMÉ COMMANDE
           ========================= -->
      <section class="card" style="padding:16px;border-radius:14px;">
        <h2 style="margin:0 0 10px;">Résumé</h2>
        <div class="muted-sm" id="cart-mini" style="margin-bottom:10px;"></div>

        <table style="width:100%;border-collapse:collapse;">
          <tbody id="order-lines"></tbody>
          <tfoot>
            <tr>
              <td style="padding-top:10px;">Sous-total</td>
              <td style="padding-top:10px;text-align:right;font-weight:800;" id="subtotal">—</td>
            </tr>
            <tr>
              <td style="padding-top:6px;">Livraison</td>
              <td style="padding-top:6px;text-align:right;font-weight:800;" id="shipping">—</td>
            </tr>
            <tr>
              <td style="padding-top:10px;font-size:18px;">Total</td>
              <td style="padding-top:10px;text-align:right;font-size:18px;font-weight:900;" id="total">—</td>
            </tr>
          </tfoot>
        </table>

        <hr style="margin:14px 0;opacity:.2" />

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <label style="display:flex;gap:8px;align-items:center;">
            <input type="radio" name="shipping" value="relay" data-cents="0" checked />
            Point relais (0€)
          </label>
          <label style="display:flex;gap:8px;align-items:center;">
            <input type="radio" name="shipping" value="home" data-cents="690" />
            Domicile (6,90€)
          </label>
        </div>
      </section>

      <!-- =========================
           2) COMPTE (AUTH)
           IMPORTANT: IDs EXACTS
           ========================= -->
      <section class="card" id="auth-card" style="padding:16px;border-radius:14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:900;font-size:18px;">Compte</div>
            <div id="auth-status" class="muted-sm" style="opacity:.85;">Vérification…</div>
          </div>

          <button id="logoutBtn" type="button" class="btn" style="display:none;">
            Se déconnecter
          </button>
        </div>

        <!-- Message auth -->
        <div id="auth-msg" style="display:none;margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:700;"></div>

        <!-- Form login -->
        <form id="login-form" style="margin-top:14px;display:none;">
          <div style="display:grid;grid-template-columns:1fr;gap:10px;">
            <div>
              <label class="muted-sm" for="login-email">Email</label>
              <input id="login-email" type="email" autocomplete="email" required />
            </div>

            <div>
              <label class="muted-sm" for="login-password">Mot de passe</label>
              <input id="login-password" type="password" autocomplete="current-password" required />
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;">
            <button id="login-btn" type="submit" class="btn">
              Se connecter
            </button>

            <button id="forgot-btn" type="button" class="btn btn-ghost">
              Mot de passe oublié ?
            </button>
          </div>
        </form>
      </section>

      <!-- =========================
           3) ADRESSE + PAIEMENT
           ========================= -->
      <section class="card" style="padding:16px;border-radius:14px;">
        <h2 style="margin:0 0 10px;">Adresse</h2>

        <form id="order-form" style="display:grid;gap:10px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <input id="first_name" placeholder="Prénom" required />
            <input id="last_name" placeholder="Nom" required />
          </div>

          <input id="phone" placeholder="Téléphone" required />
          <input id="company" placeholder="Société (optionnel)" />
          <input id="country" placeholder="Pays (ex: France)" required />
          <input id="address1" placeholder="Adresse" required />
          <input id="address2" placeholder="Complément (optionnel)" />

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <input id="postal_code" placeholder="Code postal" required />
            <input id="city" placeholder="Ville" required />
          </div>

          <textarea id="note" placeholder="Note (optionnel)"></textarea>

          <button id="place-order" type="submit">
            Payer avec Mollie
          </button>
        </form>

        <div class="muted-sm" style="margin-top:10px;">
          Paiement sécurisé via Mollie.
        </div>
      </section>

    </div>
  </main>

  <!-- Scripts (ordre important) -->
  <script src="assets/js/store.js?v=20260116"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/checkout.js?v=20260116"></script>

</body>
</html>
